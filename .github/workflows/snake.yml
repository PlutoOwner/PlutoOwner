# Bu dosyayı profil reponda şu konuma koy:
#   .github/workflows/snake.yml
#
# Her gün senin katkı tablondan yılan animasyonunu üretir ve
# "output" dalına kaydeder. README bu dosyaları oradan gösterir.

name: Katkı yılanını oluştur

on:
  schedule:
    - cron: "0 0 * * *"    # her gün 03.00 (Türkiye saati)
  workflow_dispatch:        # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Yılanı oluştur
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: output dalına gönder
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
